name: Deploy cicddev

on:
  push:
    branches: [cicddev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981651290900:role/gha-cicddev-deploy
          aws-region: us-east-1

      - name: Upload build to S3
        run: aws s3 sync dist/ "s3://cicddev-kiwivoiceassistant/cicddev/" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E2OZUYVWNIRDIE --paths "/*"
